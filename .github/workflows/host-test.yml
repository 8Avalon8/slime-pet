name: host tests
on:
  push:
  pull_request:
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bridge unit tests (what the slime knows when it chats)
        run: python3 -m unittest discover bridge -v
      - name: cc_track unit test + split render check
        run: make -C firmware/slime/host test
      - name: Firmware in the simulator, end to end
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libcjson-dev
          make -C firmware/slime/host simtest SIM_HEADLESS=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshots
          path: firmware/slime/host/out/sim/
